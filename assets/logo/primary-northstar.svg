<?xml version="1.0" encoding="UTF-8"?>
<!--
  GeoBas V3 — North-star (Polaris) primary emblem
  Original artwork, hand-authored for the Aurora Atlas V3 identity.
  Motif: celestial navigation — compass rose + Polaris (north star) + Ursa Minor asterism.
  Palette: gold #e9bd73/#ffcf81 on ink #020812/#06111e, cream #f2eadf (V3-ASSET-RESEARCH.md §9.4).
  Star positions: Hipparcos Catalogue (ESA, 1997; J2000), public domain — azimuthal equidistant
  (polar) projection about the north celestial pole. See LOGO-PROVENANCE.md.
  viewBox 0 0 512 512 — designed for dark (ink) surfaces.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GeoBas north-star emblem — compass rose, Polaris and Ursa Minor">
  <title>GeoBas V3 north-star emblem</title>
  <desc>A gold compass rose crowned by the radiant north star Polaris, encircled by Ursa Minor, on an ink tile — the GeoBas Aurora Atlas V3 identity mark.</desc>

  <defs>
    <!-- ink tile: vignette from deep blue-grey to near-black -->
    <radialGradient id="inkTile" cx="50%" cy="36%" r="78%" fx="50%" fy="34%">
      <stop offset="0%"  stop-color="#0f2239"/>
      <stop offset="48%" stop-color="#06111e"/>
      <stop offset="100%" stop-color="#020812"/>
    </radialGradient>
    <!-- global gold lighting, light from above -->
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffcf81"/>
      <stop offset="55%" stop-color="#e9bd73"/>
      <stop offset="100%" stop-color="#b3863f"/>
    </linearGradient>
    <linearGradient id="goldRose" x1="0" y1="70" x2="0" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffcf81"/>
      <stop offset="50%" stop-color="#e9bd73"/>
      <stop offset="100%" stop-color="#b3863f"/>
    </linearGradient>
    <!-- radiant Polaris -->
    <linearGradient id="starGrad" x1="0" y1="66" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#fff3d6"/>
      <stop offset="70%" stop-color="#ffcf81"/>
      <stop offset="100%" stop-color="#e9bd73"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="256" cy="118" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#ffcf81" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e9bd73" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e9bd73" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldBoss" cx="256" cy="256" r="13.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#fff6da"/>
      <stop offset="75%" stop-color="#e9bd73"/>
      <stop offset="100%" stop-color="#c8954d"/>
    </radialGradient>
  </defs>

  <!-- ink tile (self-contained emblem; dark surfaces) -->
  <rect x="46" y="46" width="420" height="420" rx="100" fill="url(#inkTile)"/>
  <!-- faint inner chart frame -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#e9bd73" stroke-width="0.5" opacity="0.18"/>

  <!-- faint chart hairlines -->
  <circle cx="256" cy="256" r="96"  fill="none" stroke="#e9bd73" stroke-width="0.6" opacity="0.13"/>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#e9bd73" stroke-width="0.6" opacity="0.11"/>

  <!-- compass ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldLine)" stroke-width="1.25" opacity="0.85"/>
  <!-- ring degree ticks (constellation sector -5..40deg and the N cardinal left open) -->
  <g stroke="url(#tickGold)" stroke-linecap="round">
  <line x1="362.1" y1="149.9" x2="368.4" y2="143.6" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="352.4" y1="141.1" x2="356.3" y2="136.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="342.0" y1="133.1" x2="345.5" y2="128.2" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="331.0" y1="126.1" x2="335.5" y2="118.3" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="319.4" y1="120.1" x2="321.9" y2="114.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="307.3" y1="115.0" x2="309.4" y2="109.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="294.8" y1="111.1" x2="297.2" y2="102.4" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="282.0" y1="108.3" x2="283.1" y2="102.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="269.1" y1="106.6" x2="269.6" y2="100.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="242.9" y1="106.6" x2="242.4" y2="100.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="230.0" y1="108.3" x2="228.9" y2="102.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="217.2" y1="111.1" x2="214.8" y2="102.4" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="204.7" y1="115.0" x2="202.6" y2="109.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="192.6" y1="120.1" x2="190.1" y2="114.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="181.0" y1="126.1" x2="176.5" y2="118.3" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="170.0" y1="133.1" x2="166.5" y2="128.2" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="159.6" y1="141.1" x2="155.7" y2="136.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="149.9" y1="149.9" x2="143.6" y2="143.6" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="141.1" y1="159.6" x2="136.5" y2="155.7" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="133.1" y1="170.0" x2="128.2" y2="166.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="126.1" y1="181.0" x2="118.3" y2="176.5" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="120.1" y1="192.6" x2="114.6" y2="190.1" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="115.0" y1="204.7" x2="109.4" y2="202.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="111.1" y1="217.2" x2="102.4" y2="214.8" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="108.3" y1="230.0" x2="102.4" y2="228.9" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="106.6" y1="242.9" x2="100.6" y2="242.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="106.0" y1="256.0" x2="92.0" y2="256.0" stroke="url(#goldLine)" stroke-width="1.6" opacity="0.95"/>
  <line x1="106.6" y1="269.1" x2="100.6" y2="269.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="108.3" y1="282.0" x2="102.4" y2="283.1" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="111.1" y1="294.8" x2="102.4" y2="297.2" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="115.0" y1="307.3" x2="109.4" y2="309.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="120.1" y1="319.4" x2="114.6" y2="321.9" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="126.1" y1="331.0" x2="118.3" y2="335.5" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="133.1" y1="342.0" x2="128.2" y2="345.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="141.1" y1="352.4" x2="136.5" y2="356.3" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="149.9" y1="362.1" x2="143.6" y2="368.4" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="159.6" y1="370.9" x2="155.7" y2="375.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="170.0" y1="378.9" x2="166.5" y2="383.8" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="181.0" y1="385.9" x2="176.5" y2="393.7" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="192.6" y1="391.9" x2="190.1" y2="397.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="204.7" y1="397.0" x2="202.6" y2="402.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="217.2" y1="400.9" x2="214.8" y2="409.6" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="230.0" y1="403.7" x2="228.9" y2="409.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="242.9" y1="405.4" x2="242.4" y2="411.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="256.0" y1="406.0" x2="256.0" y2="420.0" stroke="url(#goldLine)" stroke-width="1.6" opacity="0.95"/>
  <line x1="269.1" y1="405.4" x2="269.6" y2="411.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="282.0" y1="403.7" x2="283.1" y2="409.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="294.8" y1="400.9" x2="297.2" y2="409.6" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
