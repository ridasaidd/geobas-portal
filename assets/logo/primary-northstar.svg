  <line x1="319.4" y1="391.9" x2="321.9" y2="397.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="331.0" y1="385.9" x2="335.5" y2="393.7" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="342.0" y1="378.9" x2="345.5" y2="383.8" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="352.4" y1="370.9" x2="356.3" y2="375.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="362.1" y1="362.1" x2="368.4" y2="368.4" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="370.9" y1="352.4" x2="375.5" y2="356.3" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="378.9" y1="342.0" x2="383.8" y2="345.5" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="385.9" y1="331.0" x2="393.7" y2="335.5" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="391.9" y1="319.4" x2="397.4" y2="321.9" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="397.0" y1="307.3" x2="402.6" y2="309.4" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="400.9" y1="294.8" x2="409.6" y2="297.2" stroke="url(#goldLine)" stroke-width="1.1" opacity="0.55"/>
  <line x1="403.7" y1="282.0" x2="409.6" y2="283.1" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  <line x1="405.4" y1="269.1" x2="411.4" y2="269.6" stroke="url(#goldLine)" stroke-width="0.8" opacity="0.38"/>
  </g>

  <!-- Ursa Minor asterism: handle Polaris -> Yildun -> eps -> zeta; bowl zeta-eta-Kochab-Pherkad
       (Polaris itself is the radiant star; the handle line starts at its base) -->
  <g stroke="#f2eadf" stroke-width="0.9" stroke-opacity="0.38" stroke-linecap="round" fill="none">
    <line x1="256.0" y1="136.0" x2="352.2" y2="188.8"/>
    <line x1="352.2" y1="188.8" x2="381.4" y2="197.7"/>
    <line x1="381.4" y1="197.7" x2="402.8" y2="222.4"/>
    <line x1="402.8" y1="222.4" x2="419.5" y2="215.0"/>
    <line x1="419.5" y1="215.0" x2="412.2" y2="252.6"/>
    <line x1="412.2" y1="252.6" x2="432.8" y2="248.9"/>
    <line x1="432.8" y1="248.9" x2="402.8" y2="222.4"/>
  </g>
  <g fill="#f2eadf" fill-opacity="0.92">
    <!-- dot radius scaled by catalog visual magnitude (Hipparcos Vmag) -->
    <circle cx="352.2" cy="188.8" r="3.2"/> <!-- Yildun 4.35 -->
    <circle cx="381.4" cy="197.7" r="3.3"/> <!-- eps UMi 4.21 -->
    <circle cx="402.8" cy="222.4" r="3.2"/> <!-- zeta UMi 4.29 -->
    <circle cx="419.5" cy="215.0" r="2.6"/> <!-- eta UMi 4.95 -->
    <circle cx="412.2" cy="252.6" r="5.2"/> <!-- Kochab 2.08 -->
    <circle cx="432.8" cy="248.9" r="4.4"/> <!-- Pherkad 3.05 -->
  </g>

  <!-- compass rose: 4 long cardinal points + 4 short intercardinal points; the north
       point is elongated and carries Polaris -->
  <g fill="url(#goldRose)">
    <polygon points="256.0,128.0 240.0,256.0 256.0,256.0 272.0,256.0"/> <!-- N -->
    <polygon points="256.0,374.0 272.0,256.0 256.0,256.0 240.0,256.0"/> <!-- S -->
    <polygon points="374.0,256.0 256.0,240.0 256.0,256.0 256.0,272.0"/> <!-- E -->
    <polygon points="138.0,256.0 256.0,272.0 256.0,256.0 256.0,240.0"/> <!-- W -->
    <polygon points="308.3,203.7 248.2,248.2 256.0,256.0 263.8,263.8"/> <!-- NE -->
    <polygon points="203.7,203.7 248.2,263.8 256.0,256.0 263.8,248.2"/> <!-- NW -->
    <polygon points="203.7,308.3 263.8,263.8 256.0,256.0 248.2,248.2"/> <!-- SW -->
    <polygon points="308.3,308.3 263.8,248.2 256.0,256.0 248.2,263.8"/> <!-- SE -->
  </g>
  <!-- centre boss (the celestial pole itself) -->
  <circle cx="256" cy="256" r="13.5" fill="url(#goldBoss)" stroke="#b3863f" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Polaris: radiant north star crowning the rose -->
  <circle cx="256" cy="118" r="52" fill="#e9bd73" opacity="0.10"/>
  <circle cx="256" cy="118" r="34" fill="url(#goldGlow)"/>
  <polygon points="266.5,136.0 266.5,118.0 256.0,66.0 245.5,118.0 245.5,136.0" fill="url(#starGrad)"/>
  <polygon points="268.0,118.0 256.0,124.0 244.0,118.0 256.0,112.0" fill="url(#starGrad)"/>
