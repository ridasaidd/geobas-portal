<?xml version="1.0" encoding="UTF-8"?>
<!--
  GeoBas V3 — North-star (Polaris) emblem, MONO variant
  Single-color (one colour channel): every stroke and fill uses currentColor,
  defaulting to gold #e9bd73 for ink surfaces; retint via the CSS `color` property
  (e.g. color:#f2eadf on light surfaces). No gradients, no tile, transparent background.
  Original artwork — see LOGO-PROVENANCE.md for provenance and data sources.
  viewBox 0 0 512 512.
-->
